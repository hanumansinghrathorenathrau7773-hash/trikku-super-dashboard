<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#f2f5fb">
<meta name="description" content="TRIKKU Super Dashboard — real Google Calendar, Gmail, Drive, Sheets, Blogger and YouTube tools in one workspace.">
<title>TRIKKU Super Dashboard Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Early theme apply - prevents FOUC */
(function(){
  try{
    var t = localStorage.getItem('trikku-theme');
    if(!t){ t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    if(t === 'dark') document.documentElement.setAttribute('data-theme','dark');
    var d = localStorage.getItem('trikku-density');
    if(d === 'compact') document.documentElement.classList.add('trk-compact-pre');
  }catch(e){}
})();
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{color-scheme:light;--bg:#f1f4fa;--bg2:#e9eef7;--surface:rgba(255,255,255,.72);--surface2:rgba(255,255,255,.91);--surface3:#fff;--line:rgba(59,76,111,.13);--line2:rgba(59,76,111,.22);--ink:#17243a;--muted:#71809b;--accent:#4e63e8;--accent2:#8b5cf6;--teal:#0a9f86;--red:#d9485c;--amber:#b97d12;--blue:#1679ba;--radius:22px;--radius-sm:13px;--shadow:0 18px 48px rgba(48,64,102,.12);--shadow-sm:0 7px 20px rgba(48,64,102,.08);--glass:blur(24px) saturate(145%);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
[data-theme=dark]{color-scheme:dark;--bg:#0d1220;--bg2:#111a2c;--surface:rgba(23,32,51,.77);--surface2:rgba(28,39,61,.93);--surface3:#1b2740;--line:rgba(225,235,255,.09);--line2:rgba(225,235,255,.16);--ink:#edf3ff;--muted:#98a8c3;--accent:#8295ff;--accent2:#b58aff;--teal:#45d9b8;--red:#ff8191;--amber:#ffcf75;--blue:#6ecbff;--shadow:0 20px 55px rgba(0,0,0,.30);--shadow-sm:0 8px 24px rgba(0,0,0,.20)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(145deg,var(--bg),var(--bg2));-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-left:var(--safe-l);padding-right:var(--safe-r)}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(2px)}
body:before{width:520px;height:520px;top:-240px;left:-140px;background:radial-gradient(circle,rgba(104,135,255,.19),transparent 69%)}
body:after{width:580px;height:580px;right:-250px;bottom:-300px;background:radial-gradient(circle,rgba(151,100,255,.15),transparent 68%)}
button,input,select,textarea{font:inherit;color:inherit}
button{color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[contenteditable=true]:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 38%,transparent);outline-offset:2px}
::selection{background:rgba(91,113,240,.2)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:50px}

.app{min-height:100vh;display:flex}
.sidebar{position:sticky;top:0;height:100dvh;width:264px;flex:0 0 264px;padding:calc(18px + var(--safe-t)) 14px 18px;display:flex;flex-direction:column;z-index:80;background:var(--surface);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-right:1px solid var(--line);box-shadow:inset -1px 0 rgba(255,255,255,.35);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;gap:12px;align-items:center;padding:8px 9px 24px}
.brand-logo{width:48px;height:48px;display:grid;place-items:center;flex:none;border-radius:16px;font-size:24px;color:#fff;background:linear-gradient(145deg,#657dfb,#9c60ed);box-shadow:0 10px 18px rgba(93,112,236,.28),inset 0 1px 0 #ffffff85,inset 0 -3px 5px #303cb66b}
.brand strong{font-size:17px;letter-spacing:.7px;font-weight:800;display:block}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:2px;font-weight:800;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:5px;overflow:auto;flex:1;padding:0 2px 12px;-webkit-overflow-scrolling:touch}
.nav-label{font-size:9px;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted);font-weight:800;padding:13px 12px 5px}
.nav-item{position:relative;width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;font-weight:650;padding:12px 13px;border-radius:14px;cursor:pointer;transition:transform .18s,background .18s,border-color .18s,color .18s;min-height:44px}
.nav-item:hover{background:var(--surface2);color:var(--ink);transform:translateX(2px)}
.nav-item.active{color:var(--ink);background:linear-gradient(120deg,rgba(94,119,245,.17),rgba(161,105,239,.10));border-color:rgba(94,119,245,.25);box-shadow:inset 0 1px rgba(255,255,255,.52),0 5px 12px rgba(70,89,160,.05)}
.nav-item.active:before{content:"";position:absolute;left:-3px;top:11px;bottom:11px;width:4px;border-radius:8px;background:linear-gradient(var(--accent),var(--accent2))}
.ni{width:22px;text-align:center;font-size:17px}
.nav-count{margin-left:auto;background:rgba(217,72,92,.12);border:1px solid rgba(217,72,92,.2);color:var(--red);border-radius:99px;padding:2px 7px;font-size:10px}
.sidebar-foot{padding-top:12px;border-top:1px solid var(--line);display:grid;gap:9px;padding-bottom:var(--safe-b)}
.service-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10.5px;padding:5px 7px}
.dot{width:8px;height:8px;border-radius:50%;background:#98a3b6;box-shadow:0 0 0 3px rgba(152,163,182,.12)}
.dot.online{background:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 15%,transparent)}
.version{text-align:center;font-size:9px;letter-spacing:1.4px;color:var(--muted);font-weight:800;margin:0;padding-top:2px}

.main{min-width:0;flex:1;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:calc(12px + var(--safe-t)) 22px 12px;border-bottom:1px solid var(--line);background:var(--surface);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.menu-btn{display:none}
.page-title{min-width:0;margin:0;font-size:18px;letter-spacing:-.3px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle-top{font-size:11px;color:var(--muted);margin-top:4px}
.spacer{flex:1}
.global-search{position:relative;width:min(270px,30vw)}
.global-search input{width:100%;padding:10px 42px 10px 35px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);font-size:12px;outline:none}
.global-search:before{content:"⌕";position:absolute;left:13px;top:6px;font-size:23px;color:var(--muted);pointer-events:none}
.kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:3px 5px;pointer-events:none}
.user-chip{display:flex;align-items:center;gap:8px;max-width:178px;padding:4px 10px 4px 4px;border:1px solid var(--line);background:var(--surface2);border-radius:99px;font-size:11px;font-weight:700}
.user-chip img{width:30px;height:30px;object-fit:cover;border-radius:50%;background:var(--bg2);display:block}
.user-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.views{width:100%;max-width:1580px;margin:0 auto;padding:22px 22px calc(22px + var(--safe-b));flex:1}
.view{display:none}
.view.active{display:block;animation:enter .3s ease}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.btn{border:1px solid var(--line2);border-radius:12px;padding:10px 14px;background:var(--surface2);font-size:12px;font-weight:750;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px rgba(255,255,255,.5),0 3px 0 color-mix(in srgb,var(--line) 50%,transparent),var(--shadow-sm);transition:transform .16s,box-shadow .16s,border-color .16s,filter .16s;min-height:40px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 35%,var(--line2));box-shadow:inset 0 1px rgba(255,255,255,.5),0 5px 0 color-mix(in srgb,var(--line) 45%,transparent),0 10px 20px rgba(48,64,102,.10)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(35,45,70,.12)}
.btn.primary{color:white;background:linear-gradient(135deg,#5b74f5,#9160ed);border-color:transparent;box-shadow:inset 0 1px rgba(255,255,255,.27),0 4px 0 #4857bb,0 9px 18px rgba(83,101,221,.22)}
.btn.primary:hover{filter:saturate(1.1);box-shadow:inset 0 1px rgba(255,255,255,.27),0 5px 0 #4857bb,0 13px 24px rgba(83,101,221,.28)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,var(--line))}
.btn.sm{font-size:10.5px;padding:7px 10px;border-radius:10px;min-height:32px}
.btn.full{width:100%}
.btn:disabled{opacity:.52;cursor:not-allowed;transform:none}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;display:grid;place-items:center;cursor:pointer;font-size:16px;box-shadow:inset 0 1px rgba(255,255,255,.45),0 3px 0 color-mix(in srgb,var(--line) 55%,transparent);transition:.16s;flex:none}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--line2)}

.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:20px;justify-content:space-between;padding:26px 28px;border-radius:25px;border:1px solid var(--line);background:linear-gradient(115deg,rgba(255,255,255,.78),rgba(239,242,255,.65));box-shadow:inset 0 1px rgba(255,255,255,.78),0 13px 32px rgba(67,83,135,.09);margin-bottom:19px}
.hero:after{content:"✦";position:absolute;right:10%;top:-58px;font-size:190px;line-height:1;color:rgba(108,126,237,.07);transform:rotate(12deg);pointer-events:none}
[data-theme=dark] .hero{background:linear-gradient(115deg,rgba(32,45,73,.95),rgba(30,31,58,.76))}
.hero>*{position:relative;z-index:1}
.eyebrow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.8px;color:var(--accent);margin:0 0 9px}
.hero h2{font-size:clamp(23px,3vw,33px);letter-spacing:-1.1px;margin:0 0 9px;font-weight:800}
.hero p{max-width:640px;font-size:12.5px;line-height:1.7;color:var(--muted);margin:0}
.hero-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.grid{display:grid;gap:15px}
.grid.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:17px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:inset 0 1px rgba(255,255,255,.56),0 9px 22px rgba(54,70,111,.045);transition:transform .2s,border-color .2s,box-shadow .2s;position:relative}
.card:hover{border-color:var(--line2);box-shadow:inset 0 1px rgba(255,255,255,.55),0 13px 29px rgba(54,70,111,.08)}
.card.lift:hover{transform:translateY(-3px)}
.card.pad0{padding:0;overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.card-head h3{font-size:13px;font-weight:800;margin:0;letter-spacing:-.1px}
.card-head .spacer{flex:1}
.tile-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(111,134,246,.16),rgba(167,123,242,.1));border:1px solid rgba(104,124,227,.13);font-size:18px;box-shadow:inset 0 1px rgba(255,255,255,.7),0 4px 9px rgba(46,65,128,.06);flex:none}
.stat{display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .label{font-size:9px;text-transform:uppercase;letter-spacing:1.25px;color:var(--muted);font-weight:800}
.stat .value{font-size:clamp(22px,2.4vw,30px);letter-spacing:-1px;font-weight:800;line-height:1.08;overflow-wrap:anywhere}
.stat .sub{color:var(--muted);font-size:10.5px;line-height:1.45}
.metric-card{display:flex;align-items:flex-start;gap:13px}
.metric-card .tile-ico{flex:none}
.progress{height:7px;overflow:hidden;border-radius:99px;background:var(--line);margin-top:11px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.card-foot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:13px;font-size:10.5px;color:var(--muted)}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 13px;flex-wrap:wrap}
.section-title h2{font-size:15px;margin:0;font-weight:800;letter-spacing:-.25px}
.section-title p{font-size:11px;color:var(--muted);margin:5px 0 0}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.toolbar .grow{flex:1;min-width:180px}
.toolbar .spacer{flex:1}
.field{margin-bottom:13px}
.field label{display:block;color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:1.1px;font-weight:800;margin:0 0 6px}
.field small,.help{display:block;color:var(--muted);font-size:10.5px;line-height:1.55;margin-top:5px}
.input,.field input,.field textarea,.field select,.search-input,select,input[type=search],input[type=text],input[type=email],input[type=datetime-local],input[type=file],textarea{max-width:100%;color:var(--ink);background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;font:inherit;font-size:13px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s;min-height:42px}
.field textarea,textarea{min-height:110px;resize:vertical;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus,.search-input:focus,input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.search-wrap{position:relative;flex:1;min-width:190px}
.search-wrap:before{content:"⌕";position:absolute;left:12px;top:5px;font-size:21px;color:var(--muted);pointer-events:none;z-index:1}
.search-wrap input{padding-left:34px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;padding:5px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.green{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 30%,var(--line));background:color-mix(in srgb,var(--teal) 8%,var(--surface))}
.badge.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 28%,var(--line));background:color-mix(in srgb,var(--red) 7%,var(--surface))}
.badge.blue{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 27%,var(--line));background:color-mix(in srgb,var(--blue) 8%,var(--surface))}
.badge.amber{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 30%,var(--line));background:color-mix(in srgb,var(--amber) 8%,var(--surface))}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:11px;align-items:center;min-width:0;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--surface2) 80%,transparent);border:1px solid var(--line);transition:border-color .15s,background .15s}
.item:hover{border-color:var(--line2)}
.item.clickable{cursor:pointer}
.item.clickable:hover{background:var(--surface2)}
.item-icon{width:39px;height:39px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--surface3);border:1px solid var(--line);font-size:17px}
.item-main{flex:1;min-width:0}
.item-title{font-size:12px;font-weight:750;line-height:1.4;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.item-sub{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:3px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.item-time{font-size:9.5px;color:var(--muted);white-space:nowrap}
.item-actions{display:flex;gap:6px;align-items:center;flex:none;flex-wrap:wrap}
.item input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:10px;padding:55px 20px;color:var(--muted)}
.empty .symbol{font-size:37px}
.empty h3{color:var(--ink);font-size:14px;margin:0;font-weight:800}
.empty p{font-size:11.5px;line-height:1.7;max-width:380px;margin:0}
.loading{display:flex;align-items:center;justify-content:center;gap:11px;padding:60px 18px;color:var(--muted);font-size:11.5px;font-weight:700}
.spinner{width:22px;height:22px;border:2.5px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.table-wrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:11px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:9px 10px;text-align:left;min-width:90px;max-width:280px;white-space:pre-wrap;overflow-wrap:anywhere}
th{background:var(--surface2);position:sticky;top:0;z-index:2;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.7px}
td[contenteditable=true]{outline:2px solid transparent;background:color-mix(in srgb,var(--accent) 5%,var(--surface2));cursor:text}
td[contenteditable=true]:focus{outline-color:var(--accent)}
tr:last-child td{border-bottom:0}
.table-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11px;font-weight:750;cursor:pointer;min-height:38px}
.tab.active{background:color-mix(in srgb,var(--accent) 11%,var(--surface2));border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent)}

.modal{position:fixed;z-index:200;inset:0;display:flex;justify-content:center;align-items:center;padding:16px;background:rgba(16,24,43,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:enter .16s}
.modal-box{width:100%;max-width:650px;max-height:min(88dvh,900px);display:flex;flex-direction:column;overflow:hidden;border-radius:22px;border:1px solid var(--line2);background:var(--bg);box-shadow:0 25px 85px rgba(20,31,59,.25),inset 0 1px rgba(255,255,255,.55)}
.modal-head,.modal-foot{padding:14px 17px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex:none}
.modal-head h3{font-size:14px;margin:0;flex:1;min-width:0}
.modal-body{padding:18px;overflow:auto;font-size:12px;line-height:1.7;-webkit-overflow-scrolling:touch}
.modal-body pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-family:inherit}
.modal-foot{border-bottom:0;border-top:1px solid var(--line);justify-content:flex-end;flex-wrap:wrap;padding-bottom:calc(14px + var(--safe-b))}
.modal-body iframe{width:100%;height:350px;border:0;border-radius:12px}
.toasts{position:fixed;right:16px;bottom:calc(88px + var(--safe-b));z-index:300;display:flex;flex-direction:column;gap:9px;max-width:min(360px,calc(100vw - 32px));pointer-events:none}
.toast{display:flex;gap:9px;align-items:center;padding:12px 14px;border-radius:13px;background:var(--surface3);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:11.5px;font-weight:700;animation:enter .2s;pointer-events:auto}
.toast.success{border-left:4px solid var(--teal)}
.toast.error{border-left:4px solid var(--red)}
.toast.info{border-left:4px solid var(--accent)}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(14,20,34,.37);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.notice{display:flex;gap:11px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--amber) 28%,var(--line));background:color-mix(in srgb,var(--amber) 6%,var(--surface));padding:13px 14px;border-radius:14px;font-size:11px;line-height:1.6;color:var(--muted)}
.notice strong{color:var(--ink)}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick-action{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:13px;cursor:pointer;transition:.18s;box-shadow:inset 0 1px rgba(255,255,255,.55);min-height:56px}
.quick-action:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow-sm)}
.quick-action .qico{font-size:19px;flex:none}
.quick-action strong{display:block;font-size:11px}
.quick-action small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.check-row{display:flex;gap:9px;align-items:flex-start;font-size:11px;color:var(--muted);line-height:1.6}
.check-row input{margin-top:2px;accent-color:var(--accent)}
.channel-thumb{width:48px;height:48px;border-radius:14px;object-fit:cover;background:var(--surface2);border:1px solid var(--line)}
.video-thumb{width:82px;height:52px;object-fit:cover;border-radius:9px;background:var(--surface2);flex:none}
.progress-large{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.progress-large i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--teal));transition:width .18s}

/* Scroll progress */
.trk-progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:500;pointer-events:none;background:transparent}
.trk-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2) 50%,var(--teal));box-shadow:0 0 14px color-mix(in srgb,var(--accent) 55%,transparent);transition:width .09s linear}

/* Back to top */
.trk-top{position:fixed;right:calc(20px + var(--safe-r));bottom:calc(88px + var(--safe-b));z-index:148;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line2);background:color-mix(in srgb,var(--surface2) 92%,transparent);color:var(--ink);font-size:16px;font-weight:800;box-shadow:inset 0 1px rgba(255,255,255,.6),0 3px 0 color-mix(in srgb,var(--line2) 45%,transparent),0 10px 24px rgba(42,57,102,.10);opacity:0;transform:translate3d(0,14px,0) scale(.9);pointer-events:none;transition:opacity .28s ease,transform .32s cubic-bezier(.22,1,.36,1),box-shadow .22s,border-color .22s}
.trk-top.show{opacity:1;transform:none;pointer-events:auto}
.trk-top:hover{transform:translate3d(0,-3px,0);border-color:color-mix(in srgb,var(--accent) 40%,var(--line2))}

/* Scroll reveal */
.trk-reveal{opacity:0;transform:translate3d(0,20px,0);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1)}
.trk-reveal.in{opacity:1;transform:translate3d(0,0,0)}

/* Live clock */
.trk-clock{display:inline-flex;align-items:baseline;gap:9px;margin-top:12px;padding:7px 12px;border-radius:12px;background:color-mix(in srgb,var(--surface2) 70%,transparent);border:1px solid color-mix(in srgb,var(--line2) 70%,transparent);font-variant-numeric:tabular-nums;box-shadow:inset 0 1px rgba(255,255,255,.5)}
.trk-clock .t{font-size:20px;font-weight:800;letter-spacing:-.7px;line-height:1}
.trk-clock .d{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.3px}

/* Focus mode */
body.trk-focus .sidebar,body.trk-focus .topbar,body.trk-focus .trk-fab,body.trk-focus .trk-top{opacity:.28;filter:blur(1.5px);transition:opacity .45s ease,filter .45s ease}
body.trk-focus .sidebar:hover,body.trk-focus .topbar:hover,body.trk-focus .trk-fab:hover{opacity:1;filter:none}

/* Compact density */
body.trk-compact .card{padding:15px;border-radius:18px}
body.trk-compact .grid{gap:11px}
body.trk-compact .grid.stats{gap:11px;margin-bottom:13px}
body.trk-compact .views{padding:18px}
body.trk-compact .hero{padding:22px;margin-bottom:15px}
body.trk-compact .section-title{margin:18px 0 10px}

/* Liquid glass accents */
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 22%);opacity:.65;transition:opacity .35s ease}
[data-theme=dark] .card::after{background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 22%);opacity:.55}
.card > *{position:relative;z-index:3}

/* FAB */
.trk-fab{position:fixed;right:calc(20px + var(--safe-r));bottom:calc(20px + var(--safe-b));z-index:150;width:54px;height:54px;border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);background:linear-gradient(145deg,#5877f4,#9862e9);color:#fff;font-size:22px;display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.42),0 6px 0 #4657b6,0 14px 28px rgba(84,102,225,.34);transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s,filter .22s}
.trk-fab:hover{transform:translateY(-3px) rotate(-6deg);filter:saturate(1.08)}
.trk-fab:active{transform:translateY(1px) scale(.96)}

/* Toolbox panel */
.trk-panel{position:fixed;right:calc(20px + var(--safe-r));bottom:calc(86px + var(--safe-b));z-index:149;width:min(370px,calc(100vw - 40px));max-height:min(560px,72vh);background:var(--surface2);border:1px solid var(--line2);border-radius:20px;overflow:hidden;box-shadow:0 22px 55px rgba(20,35,80,.24),inset 0 1px rgba(255,255,255,.5);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);display:flex;flex-direction:column;animation:trkPanelIn .26s cubic-bezier(.22,1,.36,1);transform-origin:bottom right}
@keyframes trkPanelIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.trk-panel[hidden]{display:none!important}
.trk-tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.trk-tab{flex:1;padding:8px 10px;font-size:11px;font-weight:750;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);transition:background .18s,border-color .18s,color .18s;min-height:38px}
.trk-tab.active{background:color-mix(in srgb,var(--accent) 13%,var(--surface2));border-color:color-mix(in srgb,var(--accent) 28%,var(--line));color:var(--ink)}
.trk-pane{padding:14px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.trk-pane[hidden]{display:none!important}
.trk-note-input{width:100%;min-height:88px;resize:vertical;border-radius:12px;border:1px solid var(--line2);background:var(--surface3);padding:10px 12px;font-size:13px;color:var(--ink);font-family:inherit;outline:none}
.trk-note-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.trk-note-actions{display:flex;gap:6px;margin-top:8px}
.trk-notes-list{margin-top:12px;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.trk-note{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:11px;background:color-mix(in srgb,var(--surface) 80%,transparent);border:1px solid var(--line);font-size:11.5px;line-height:1.5}
.trk-note-text{flex:1;word-break:break-word;white-space:pre-wrap}
.trk-note .del{border:0;background:transparent;color:var(--red);cursor:pointer;font-size:18px;padding:0 4px;line-height:1;min-height:24px}
.trk-timer-display{text-align:center;font-size:44px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:10px 0 6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.trk-timer-label{text-align:center;font-size:11px;color:var(--muted);margin-bottom:14px}
.trk-timer-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.trk-timer-presets{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.trk-act-list{display:flex;flex-direction:column;gap:6px}
.trk-act-item{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid var(--line);font-size:11px;line-height:1.5}
.trk-act-item .ico{font-size:14px;color:var(--accent)}
.trk-act-item .time{margin-left:auto;font-size:9.5px;color:var(--muted);white-space:nowrap}
.trk-act-empty{text-align:center;color:var(--muted);padding:22px;font-size:11.5px}

/* Command palette */
.cmdk{position:fixed;inset:0;z-index:400;display:flex;align-items:flex-start;justify-content:center;padding:11vh 16px 16px;background:rgba(15,22,42,.42);backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%);animation:trkFadeIn .18s ease}
.cmdk[hidden]{display:none!important}
.cmdk-box{width:100%;max-width:580px;max-height:70vh;display:flex;flex-direction:column;background:var(--surface2);border:1px solid var(--line2);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(15,25,55,.32),inset 0 1px rgba(255,255,255,.55);backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%);animation:cmdkIn .22s cubic-bezier(.22,1,.36,1)}
@keyframes cmdkIn{from{opacity:0;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:none}}
.cmdk-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.cmdk-icon{font-size:18px;color:var(--muted)}
.cmdk-head input{flex:1;border:0!important;background:transparent!important;box-shadow:none!important;font-size:15px;padding:4px 0!important;outline:none;min-height:auto!important}
.cmdk-head input:focus{box-shadow:none!important;transform:none!important}
.cmdk-head .kbd{position:static;transform:none}
.cmdk-list{overflow:auto;padding:8px;min-height:100px;-webkit-overflow-scrolling:touch}
.cmdk-group{font-size:9.5px;text-transform:uppercase;letter-spacing:1.3px;font-weight:800;color:var(--muted);padding:10px 10px 6px}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;cursor:pointer;font-size:12.5px;transition:background .12s;user-select:none;min-height:44px}
.cmdk-item:hover,.cmdk-item.active{background:color-mix(in srgb,var(--accent) 13%,var(--surface))}
.cmdk-item .ico{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--surface3);border:1px solid var(--line);font-size:14px;flex:none}
.cmdk-item .cmdk-meta{margin-left:auto;font-size:10px;color:var(--muted);font-family:ui-monospace,monospace}
.cmdk-empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:12px}
.cmdk-foot{display:flex;gap:14px;padding:10px 14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);background:color-mix(in srgb,var(--surface) 55%,transparent);flex-wrap:wrap}
.cmdk-foot .kbd{position:static;transform:none}

/* Density pre-load */
.trk-compact-pre .card{padding:15px;border-radius:18px}
.trk-compact-pre .grid{gap:11px}
.trk-compact-pre .grid.stats{gap:11px;margin-bottom:13px}
.trk-compact-pre .views{padding:18px}
.trk-compact-pre .hero{padding:22px;margin-bottom:15px}
.trk-compact-pre .section-title{margin:18px 0 10px}

/* ============ MOBILE OPTIMIZATIONS ============ */
@media(max-width:1120px){
  .sidebar{width:235px;flex-basis:235px}
  .views{padding:18px}
  .grid.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:22px}
  .global-search{width:min(220px,26vw)}
}
@media(max-width:850px){
  body:before,body:after{display:none}
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);width:min(290px,86vw);height:100dvh;box-shadow:var(--shadow);backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface2)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:grid}
  .topbar{padding:calc(11px + var(--safe-t)) 14px 11px;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface2)}
  .views{padding:14px}
  .global-search{width:36vw}
  .subtitle-top{display:none}
  .hero{align-items:flex-start;flex-direction:column;border-radius:20px}
  .hero-actions{width:100%}
  .hero-actions .btn{flex:1;min-width:130px}
  .grid.two,.grid.three{grid-template-columns:1fr 1fr}
  .grid.four{grid-template-columns:1fr 1fr}
  .card,.hero,.modal-box,.trk-panel,.cmdk-box{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .card,.hero,.modal-box{background:var(--surface2)}
  .view.active{animation:none}
  .trk-panel{background:var(--surface2)}
  .cmdk-box{background:var(--surface2)}
  .btn:hover,.tab:hover,.card:hover,.hero:hover,.quick-action:hover,.icon-btn:hover{transform:none!important}
  .card::after{display:none}
  .trk-reveal{transition-duration:.45s}
  .modal-box{max-height:94dvh}
  body.trk-focus .sidebar,body.trk-focus .topbar{opacity:.4;filter:none}
}
@media(max-width:600px){
  .views{padding:11px}
  .topbar{padding:calc(9px + var(--safe-t)) 11px 9px;gap:7px}
  .page-title{font-size:15px}
  .global-search{display:none}
  .user-chip{padding:3px;max-width:42px;min-width:42px}
  .user-chip span{display:none}
  .user-chip img{width:30px;height:30px}
  .topbar .btn{padding:8px 11px;font-size:10.5px}
  .topbar .icon-btn{width:38px;height:38px}
  .grid.stats,.grid.two,.grid.three,.grid.four{grid-template-columns:1fr}
  .grid.stats{grid-template-columns:1fr 1fr;gap:10px}
  .grid.stats .stat .value{font-size:22px}
  .grid.stats .tile-ico{width:34px;height:34px;font-size:15px}
  .grid.stats .metric-card{gap:10px}
  .hero{padding:17px;border-radius:18px}
  .hero h2{font-size:22px;letter-spacing:-.7px}
  .hero p{font-size:11.5px}
  .hero:after{font-size:130px;top:-30px}
  .hero-actions .btn{flex:1;min-width:0}
  .card{padding:15px;border-radius:18px}
  .metric-card .value{font-size:22px}
  .quick-grid{grid-template-columns:1fr 1fr}
  .quick-action{padding:11px;gap:8px}
  .toolbar{gap:7px}
  .toolbar .grow,.search-wrap{min-width:100%;flex-basis:100%}
  .toolbar .btn{flex:1}
  .item{padding:10px;gap:9px;flex-wrap:wrap}
  .item-actions{width:100%;justify-content:flex-end;margin-top:2px}
  .item-actions .btn{padding:6px 9px;min-height:32px}
  .item-time{display:none}
  .modal{padding:8px;align-items:flex-end}
  .modal-box{max-height:92dvh;border-radius:20px 20px 0 0;border-bottom-left-radius:0;border-bottom-right-radius:0}
  .modal-body{padding:14px}
  .modal-foot{padding:12px;padding-bottom:calc(12px + var(--safe-b))}
  .modal-foot .btn{flex:1;min-width:120px}
  .section-title{margin-top:20px;flex-direction:column;align-items:flex-start;gap:6px}
  .section-title .btn{align-self:stretch}
  .toasts{right:10px;left:10px;bottom:calc(78px + var(--safe-b));max-width:none}
  .trk-fab{right:14px;bottom:calc(14px + var(--safe-b));width:50px;height:50px;font-size:20px}
  .trk-panel{right:10px;left:10px;bottom:calc(74px + var(--safe-b));width:auto;max-height:74vh}
  .trk-top{right:14px;bottom:calc(74px + var(--safe-b));width:42px;height:42px}
  .cmdk{padding:6vh 8px 8px}
  .cmdk-box{max-height:86vh}
  .cmdk-foot{font-size:9.5px;gap:10px}
  .tabs{gap:5px}
  .tab{padding:8px 11px;font-size:10.5px;flex:1;text-align:center;min-width:0}
  .channel-thumb{width:42px;height:42px}
  .video-thumb{width:70px;height:44px}
  table{font-size:10.5px}
  th,td{padding:8px}
  .card-head{flex-direction:row;align-items:center}
  .card-head .spacer{display:none}
}
@media(max-width:380px){
  .grid.stats{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:1fr}
  .hero-actions .btn{flex-basis:100%}
}

/* Touch device optimizations */
@media (pointer:coarse){
  body:before,body:after{display:none}
  .card::after{display:none}
  .btn,.tab,.nav-item,.icon-btn,.quick-action,.cmdk-item,.trk-tab{min-height:44px}
  .btn.sm{min-height:36px}
  .item{padding:12px}
  .icon-btn{width:44px;height:44px}
  * { -webkit-tap-highlight-color: transparent; }
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  .trk-reveal{opacity:1;transform:none;transition:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-logo">⚡</div><div><strong>TRIKKU</strong><small>SUPER DASHBOARD PRO</small></div></div>
  <nav class="nav" id="nav" aria-label="Primary navigation">
    <div class="nav-label">Workspace</div>

    <button class="nav-item" data-view="calendar"><span class="ni">▦</span><span>Calendar</span></button>
    <button class="nav-item" data-view="gmail"><span class="ni">✉</span><span>Gmail</span><span class="nav-count" id="unreadBadge" hidden></span></button>
    <button class="nav-item" data-view="drive"><span class="ni">▱</span><span>Drive</span></button>
    <button class="nav-item" data-view="sheets"><span class="ni">▤</span><span>Sheets</span></button>
    <button class="nav-item" data-view="blogger"><span class="ni">✎</span><span>Blogger</span></button>
    <button class="nav-item" data-view="youtube"><span class="ni">▶</span><span>YouTube</span></button>
    <div class="nav-label">System</div>
    <button class="nav-item" data-view="settings"><span class="ni">⚙</span><span>Settings</span></button>
  </nav>
  <div class="sidebar-foot">
    <div class="service-status"><span class="dot" id="networkDot"></span><span id="networkLabel">Checking connection…</span></div>
    <button class="btn ghost full" id="themeBtn">☾ Switch to dark mode</button>
    <p class="version">TRIKKU · PRO BUILD 2.2</p>
  </div>
</aside>
<div class="scrim" id="scrim"></div>
<main class="main">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation">☰</button>
    <div style="min-width:0">
      <h1 class="page-title" id="pageTitle">Overview</h1>
      <div class="subtitle-top" id="pageSubtitle">Your Google workspace, in one place</div>
    </div>
    <div class="spacer"></div>

      <input id="globalSearch" type="search" placeholder="Search Drive files…" autocomplete="off" aria-label="Global Drive search">

    <div class="user-chip" id="userChip" hidden><img id="userAvatar" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23dde3f0'/%3E%3C/svg%3E"><span id="userName"></span></div>
    <button class="btn primary" id="signInBtn">Connect</button>
    <button class="btn ghost" id="signOutBtn" hidden>Sign out</button>
  </header>
  <div class="views">
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-calendar"></section>
    <section class="view" id="view-gmail"></section>
    <section class="view" id="view-drive"></section>
    <section class="view" id="view-sheets"></section>
    <section class="view" id="view-blogger"></section>
    <section class="view" id="view-youtube"></section>
    <section class="view" id="view-settings"></section>
  </div>
</main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle">Dialog</h3><button class="icon-btn" id="modalClose" aria-label="Close dialog">×</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

<button class="trk-fab" id="trkFab" aria-label="Open toolbox" title="Toolbox (Notes · Timer · Activity)">✦</button>
<div class="trk-panel" id="trkPanel" hidden role="dialog" aria-label="Toolbox">
  <div class="trk-tabs" role="tablist">
    <button class="trk-tab active" data-trk-tab="notes" role="tab">📝 Notes</button>
    <button class="trk-tab" data-trk-tab="timer" role="tab">⏱ Timer</button>
    <button class="trk-tab" data-trk-tab="activity" role="tab">📊 Activity</button>

/* ---------- AUTH ---------- */
function initGoogle(){
  if(gsiReady && tokenClient) return true;
  if(!window.google || !google.accounts || !google.accounts.oauth2) return false;
  if(!CONFIG.CLIENT_ID || CONFIG.CLIENT_ID.indexOf('.apps.googleusercontent.com') < 0) return false;
  try{
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.CLIENT_ID,
      scope: CONFIG.SCOPES.join(' '),
      include_granted_scopes: true,
      callback: function(resp){
        var w = tokenWaiter;
        tokenWaiter = null;
        if(resp && resp.error){
          if(w) w.reject(new Error(resp.error_description || resp.error));
          else toast('Google authorisation failed: ' + resp.error, 'error');
          return;
        }
        accessToken = resp.access_token;
        tokenExpiresAt = Date.now() + Math.max(60, (Number(resp.expires_in)||3600) - 60) * 1000;
        if(w) w.resolve(accessToken);
        else onSignedIn();
      }
    });
    gsiReady = true;
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}
function requestToken(interactive){
  return new Promise(function(resolve, reject){
    if(!tokenClient){ reject(new Error('Google sign-in library is not ready. Check internet and try again.')); return; }
    if(tokenWaiter){ tokenWaiter.reject(new Error('A sign-in request was replaced.')); tokenWaiter = null; }
    tokenWaiter = { resolve: resolve, reject: reject };
    try{ tokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' }); }
    catch(e){ tokenWaiter = null; reject(e); }
  });
}
async function ensureToken(){
  if(accessToken && Date.now() < tokenExpiresAt) return accessToken;
  if(!tokenClient && !initGoogle()) throw new Error('Google sign-in is not ready. Reload the page and try again.');
  if(accessToken){
    accessToken = null; tokenExpiresAt = 0;
    try{ return await requestToken(false); }
    catch(e){ throw new Error('Your Google session expired. Tap "Connect Google" and sign in again.'); }
  }
  throw new Error('Connect your Google account first.');
}
async function api(url, options){
  await ensureToken();
  var opt = Object.assign({}, options || {});
  opt.headers = Object.assign({}, opt.headers || {}, { Authorization: 'Bearer ' + accessToken });
  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var timeoutId = 0;
  if(ctrl){
    opt.signal = ctrl.signal;
    timeoutId = setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, 45000);
  }
  var res;
  try{ res = await fetch(url, opt); }
  catch(e){
    if(timeoutId) clearTimeout(timeoutId);
    if(e.name === 'AbortError') throw new Error('Request timed out. Check your connection and retry.');
    throw new Error('Network/CORS error. Check internet, API enablement and authorised web origin.');
  }
  if(timeoutId) clearTimeout(timeoutId);
  if(res.status === 401){ accessToken = null; tokenExpiresAt = 0; throw new Error('Google session expired. Please connect again.'); }
  if(!res.ok){
    var raw = await res.text().catch(function(){ return ''; }), detail = raw;
    try{
      var j = JSON.parse(raw);
      if(j.error && j.error.message) detail = j.error.message;
      if(j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason) detail += ' (' + j.error.errors[0].reason + ')';
    }catch(e){}
    throw new Error(res.status + ' — ' + (detail || res.statusText).slice(0, 450));
  }
  if(res.status === 204) return null;
  var ct = res.headers.get('content-type') || '';
  if(ct.indexOf('application/json') > -1) return res.json();
  return res.text();
}

function b64urlText(str){
  var bytes = new TextEncoder().encode(str), bin = '';
  for(var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function safeHeader(s){ return String(s||'').replace(/[\r\n]/g,' ').trim(); }
function extractBody(payload){
  if(!payload) return { html: '', text: '' };
  var out = { html: '', text: '' };
  function walk(p){
    if(!p) return;
    if(p.mimeType === 'text/html' && p.body && p.body.data && !out.html) out.html = decodeB64(p.body.data);
    if(p.mimeType === 'text/plain' && p.body && p.body.data && !out.text) out.text = decodeB64(p.body.data);
    (p.parts || []).forEach(walk);
  }
  walk(payload);
  return out;
}
function decodeB64(s){
  try{
    var raw = atob(String(s).replace(/-/g,'+').replace(/_/g,'/'));
    var arr = Uint8Array.from(raw, function(c){ return c.charCodeAt(0); });
    return new TextDecoder('utf-8', { fatal: false }).decode(arr);
  }catch(e){ return ''; }
}
function sanitizeEmailHTML(html){
  var doc = new DOMParser().parseFromString(String(html||''), 'text/html');
  var allowed = new Set(['P','DIV','SPAN','BR','HR','B','STRONG','I','EM','U','S','BLOCKQUOTE','UL','OL','LI','H1','H2','H3','H4','PRE','CODE','TABLE','THEAD','TBODY','TR','TH','TD','A']);
  Array.from(doc.body.querySelectorAll('*')).forEach(function(el){
    if(!allowed.has(el.tagName)){ el.replaceWith(doc.createTextNode(el.textContent || '')); return; }
    Array.from(el.attributes).forEach(function(a){
      if(el.tagName === 'A' && a.name.toLowerCase() === 'href'){
        try{
          var u = new URL(a.value, location.href);
          if(u.protocol !== 'https:' && u.protocol !== 'http:' && u.protocol !== 'mailto:') el.removeAttribute('href');
          else{ el.setAttribute('target','_blank'); el.setAttribute('rel','noopener noreferrer'); }
        }catch(e){ el.removeAttribute('href'); }
      } else if(el.tagName === 'TD' || el.tagName === 'TH'){
        if(!['colspan','rowspan'].includes(a.name.toLowerCase())) el.removeAttribute(a.name);
      } else el.removeAttribute(a.name);
    });
  });
  return doc.body.innerHTML;
}

async function uploadToDrive(file){
  try{
    toast('Uploading ' + file.name, 'info');
    var metadata = { name: file.name, mimeType: file.type || 'application/octet-stream' };
    if(driveParentId) metadata.parents = [driveParentId];
    await ensureToken();
    var start = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + accessToken,
        'Content-Type': 'application/json; charset=UTF-8',
        'X-Upload-Content-Type': metadata.mimeType,
        'X-Upload-Content-Length': String(file.size)
      },
      body: JSON.stringify(metadata)
    });
    if(!start.ok) throw new Error('Could not start upload: ' + start.status + ' ' + (await start.text()).slice(0,250));
    var loc = start.headers.get('Location');
    if(!loc) throw new Error('Google did not return an upload URL.');
    var put = await fetch(loc, { method: 'PUT', headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': metadata.mimeType }, body: file });
    if(!put.ok) throw new Error('Upload failed: ' + put.status + ' ' + (await put.text()).slice(0,250));
    toast('File uploaded: ' + file.name, 'success');
  }catch(e){ toast(e.message, 'error'); }
}

async function downloadDriveFile(id, name, mime){
  try{
    await ensureToken();
    var native = {
      'application/vnd.google-apps.document': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      'application/vnd.google-apps.spreadsheet': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      'application/vnd.google-apps.presentation': 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      'application/vnd.google-apps.drawing': 'application/pdf'
    };
    var url = native[mime]
      ? 'https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'/export?mimeType='+encodeURIComponent(native[mime])
      : 'https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(id)+'?alt=media';
    var res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
    if(!res.ok) throw new Error(res.status + ' — ' + (await res.text()).slice(0,200));
    var blob = await res.blob(), a = document.createElement('a'), objectUrl = URL.createObjectURL(blob);
    a.href = objectUrl;
    a.download = name + (native[mime] ? (native[mime].includes('wordprocessing')?'.docx':native[mime].includes('spreadsheetml')?'.xlsx':native[mime].includes('presentationml')?'.pptx':'.pdf') : '');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(objectUrl); }, 1000);
    toast('Download started', 'success');
  }catch(e){ toast('Download failed: ' + e.message, 'error'); }
}

async function loadSpreadsheet(container, info){
  container.innerHTML = loading('Loading sheet tabs…');
  try{
    var meta = await api('https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(selectedSheetId)+'?fields=properties(title),sheets(properties(sheetId,title,index,gridProperties(rowCount,columnCount)))');
    var sheets = meta.sheets || [];
    if(!sheets.length){ container.innerHTML = empty('📄','No worksheet tabs','This spreadsheet has no visible sheets.'); return; }
    var tab = sheets.find(function(s){ return s.properties.title === selectedSheetName; }) || sheets[0];
    selectedSheetName = tab.properties.title;
    var gridProps = tab.properties.gridProperties || {};
    var maxRow = Math.max(1, Math.min(gridProps.rowCount || 100, 500));
    var maxCol = Math.max(1, Math.min(gridProps.columnCount || 26, 52));
    var range = "'"+selectedSheetName.replace(/'/g,"''")+"'!A1:"+colName(maxCol)+maxRow;
    var res = await api('https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(selectedSheetId)+'/values/'+encodeURIComponent(range));
    var rows = res.values || [];
    var cols = Math.max(1, rows.reduce(function(m, r){ return Math.max(m, r.length); }, 0));
    info.innerHTML = '<div class="card-head"><div class="tile-ico">📊</div><div><h3>'+esc(meta.properties.title)+'</h3><div class="help">'+esc(selectedSheetName)+' · A1:'+colName(cols)+Math.max(rows.length,1)+'</div></div><div class="spacer"></div><span class="badge blue">Live data</span></div><div class="tabs" id="sheetTabs">'+sheets.map(function(s){ return '<button class="tab '+(s.properties.title === selectedSheetName ? 'active' : '')+'" data-sheet-tab="'+esc(s.properties.title)+'">'+esc(s.properties.title)+'</button>'; }).join('')+'</div>';
    $('#sheetTabs', info).querySelectorAll('[data-sheet-tab]').forEach(function(b){
      b.addEventListener('click', function(){ selectedSheetName = b.dataset.sheetTab; loadSpreadsheet(container, info); });
    });
    if(!rows.length){ container.innerHTML = empty('🧾','This worksheet is empty','Add values in Google Sheets, then refresh here.'); return; }
    var normalized = rows.map(function(r){
      var a = []; for(var i = 0; i < cols; i++) a.push(r[i] == null ? '' : String(r[i]));
      return a;
    });
    var table = '<div class="toolbar"><span class="badge">'+rows.length+' rows · '+cols+' columns</span><div class="spacer"></div>' +
      '<button class="btn" id="sheetEdit">✎ Edit</button>' +
      '<button class="btn primary" id="sheetSave" hidden>Save</button>' +
      '<button class="btn" id="sheetCancel" hidden>Cancel</button></div>' +
      '<div class="table-wrap"><table id="sheetTable"><thead><tr>' +
        normalized[0].map(function(v){ return '<th>'+esc(v)+'</th>'; }).join('') +
      '</tr></thead><tbody>' +
        normalized.slice(1).map(function(r){ return '<tr>'+r.map(function(v){ return '<td>'+esc(v)+'</td>'; }).join('')+'</tr>'; }).join('') +
      '</tbody></table></div>' +
      '<div class="table-foot"><span>Loaded A1:'+colName(cols)+rows.length+'</span><span>RAW input — formulas are not executed.</span></div>';
    container.innerHTML = table;
    $('#sheetEdit').addEventListener('click', function(){
      $$('#sheetTable td').forEach(function(td){ td.contentEditable = 'true'; });
      $$('#sheetTable th').forEach(function(th){ th.contentEditable = 'true'; });
      $('#sheetEdit').hidden = true;
      $('#sheetSave').hidden = false;
      $('#sheetCancel').hidden = false;
      toast('Cell editing enabled', 'info');
    });
    $('#sheetCancel').addEventListener('click', function(){ loadSpreadsheet(container, info); });
    $('#sheetSave').addEventListener('click', async function(){
      var b = this; b.disabled = true; b.textContent = 'Saving…';
      var liveRows = [Array.from($('#sheetTable thead tr').cells).map(function(c){ return c.innerText; })]
        .concat($$('#sheetTable tbody tr').map(function(tr){ return Array.from(tr.cells).map(function(c){ return c.innerText; }); }));
      var rng = "'"+selectedSheetName.replace(/'/g,"''")+"'!A1:"+colName(cols)+liveRows.length;
      try{
        await api('https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(selectedSheetId)+'/values/'+encodeURIComponent(rng)+'?valueInputOption=RAW', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ range: rng, majorDimension: 'ROWS', values: liveRows })
        });
        toast('Spreadsheet values saved', 'success');
        loadSpreadsheet(container, info);
      }catch(e){ toast('Save failed: ' + e.message, 'error'); b.disabled = false; b.textContent = 'Save'; }
    });
  }catch(e){
    container.innerHTML = empty('⚠','Could not load spreadsheet', e.message);
  }
}
function colName(n){
  var s = '';
  while(n > 0){ var r = (n-1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n-1)/26); }
  return s || 'A';
}

async function loadBlogPosts(box){
  box.innerHTML = loading('Loading posts…');
  try{
    var blogId = encodeURIComponent(selectedBlogId);
    var responses = await Promise.allSettled([
      api('https://www.googleapis.com/blogger/v3/blogs/'+blogId+'/posts?maxResults=30&status=LIVE'),
      api('https://www.googleapis.com/blogger/v3/blogs/'+blogId+'/posts?maxResults=30&status=DRAFT'),
      api('https://www.googleapis.com/blogger/v3/blogs/'+blogId+'/posts?maxResults=30&status=SCHEDULED')
    ]);
    var posts = [];
    responses.forEach(function(r){ if(r.status === 'fulfilled' && r.value.items) posts = posts.concat(r.value.items); });
    var seen = {};
    posts = posts.filter(function(p){ if(seen[p.id]) return false; seen[p.id] = true; return true; })
      .sort(function(a,b){ return new Date(b.updated || b.published || 0) - new Date(a.updated || a.published || 0); });
    if(!posts.length){ box.innerHTML = empty('📝','No posts yet','Create your first Blogger post.'); return; }
    box.innerHTML = '<div class="list" style="padding:13px">'+posts.map(function(p){
      var link = safeUrl(p.url);
      return '<div class="item"><div class="item-icon">✎</div><div class="item-main"><div class="item-title">'+esc(p.title || '(untitled)')+'</div><div class="item-sub">'+esc(p.status || 'POST')+' · '+esc(relTime(p.published || p.updated))+'</div></div><div class="item-actions">'+(link?'<a class="btn sm" href="'+esc(link)+'" target="_blank" rel="noopener">View</a>':'')+'<button class="btn sm" data-edit-post="'+esc(p.id)+'">Edit</button><button class="btn sm danger" data-delete-post="'+esc(p.id)+'">Delete</button></div></div>';
    }).join('') + '</div>';
    box.querySelectorAll('[data-edit-post]').forEach(function(b){
      b.addEventListener('click', function(){ openPostModal(posts.find(function(p){ return p.id === b.dataset.editPost; }), null); });
    });
    box.querySelectorAll('[data-delete-post]').forEach(function(b){
      b.addEventListener('click', async function(){
        var p = posts.find(function(x){ return x.id === b.dataset.deletePost; });
        if(!confirm('Delete Blogger post "'+(p && p.title || 'Untitled')+'"?')) return;
        try{
          await api('https://www.googleapis.com/blogger/v3/blogs/'+encodeURIComponent(selectedBlogId)+'/posts/'+encodeURIComponent(b.dataset.deletePost), { method: 'DELETE' });
          toast('Post deleted', 'success');
          loadBlogPosts(box);
        }catch(e){ toast(e.message, 'error'); }
      });
    });
  }catch(e){ box.innerHTML = empty('⚠','Could not load posts', e.message); }
}
function openPostModal(post, blogs){
  var edit = !!post;
  var blogOptions = blogs ? blogs.map(function(b){ return '<option value="'+esc(b.id)+'" '+(b.id === selectedBlogId ? 'selected' : '')+'>'+esc(b.name)+'</option>'; }).join('') : '';
  openModal(edit ? 'Edit Blogger post' : 'Create Blogger post',
    (blogs ? '<div class="field"><label>Blog</label><select id="postBlog">'+blogOptions+'</select></div>' : '') +
    '<div class="field"><label>Title *</label><input id="postTitle" maxlength="500" value="'+esc(post && post.title || '')+'" placeholder="Post title"></div>' +
    '<div class="field"><label>Content (HTML allowed)</label><textarea id="postContent" style="min-height:210px" placeholder="&lt;p&gt;Write your post…&lt;/p&gt;">'+esc(post && post.content || '')+'</textarea><small>HTML content will be sent to Blogger as authored; preview before publishing.</small></div>' +
    (!edit ? '<label class="check-row"><input type="checkbox" id="postDraft"> Save as draft instead of publishing</label>' : ''),
    '<button class="btn ghost" id="postCancel">Cancel</button><button class="btn primary" id="postSave">'+(edit ? 'Save changes' : 'Publish')+'</button>');
  $('#postCancel').addEventListener('click', closeModal);
  $('#postSave').addEventListener('click', async function(){
    var title = $('#postTitle').value.trim(), content = $('#postContent').value;
    if(!title){ toast('Post title is required', 'error'); return; }
    var blogId = blogs ? $('#postBlog').value : selectedBlogId;
    var wasDraft = !edit && $('#postDraft') && $('#postDraft').checked;
    var b = this; b.disabled = true; b.textContent = edit ? 'Saving…' : (wasDraft ? 'Saving…' : 'Publishing…');
    try{
      if(edit){
        await api('https://www.googleapis.com/blogger/v3/blogs/'+encodeURIComponent(blogId)+'/posts/'+encodeURIComponent(post.id), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: post.id, blogId: blogId, title: title, content: content })
        });
      } else {
        await api('https://www.googleapis.com/blogger/v3/blogs/'+encodeURIComponent(blogId)+'/posts/'+(wasDraft ? '?isDraft=true' : ''), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title, content: content })
        });
      }
      selectedBlogId = blogId;
      closeModal();
      toast(edit ? 'Post updated' : (wasDraft ? 'Post saved as draft' : 'Post published'), 'success');
      go('blogger');
    }catch(e){ toast(e.message, 'error'); b.disabled = false; b.textContent = edit ? 'Save changes' : 'Publish'; }
  });
}

    '</div></div>' +

    '<div class="card pad0" id="ytResults">'+loading('Loading videos…')+'</div>';

  $('#ytUpload').addEventListener('click', openYouTubeUpload);
  $('#ytSearch').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ ytQuery = this.value.trim(); ytTab = 'search'; loadYouTubeResults($('#ytResults'), uploads); } });
  $('#ytSearchBtn').addEventListener('click', function(){ ytQuery = $('#ytSearch').value.trim(); ytTab = 'search'; loadYouTubeResults($('#ytResults'), uploads); });
  root.querySelectorAll('[data-yt-tab]').forEach(function(b){

async function loadYouTubeResults(box, uploads){
  box.innerHTML = loading('Loading YouTube videos…');
  try{
    var videos = [];
    if(ytTab === 'uploads' && uploads){
      var p = await api('https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=20&playlistId='+encodeURIComponent(uploads));
      videos = (p.items || []).map(function(x){ return { id: x.snippet && x.snippet.resourceId && x.snippet.resourceId.videoId, snippet: x.snippet || {}, statistics: null }; });
    } else if(ytTab === 'trending'){
      var t = await api('https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&maxResults=15&regionCode=IN');
      videos = t.items || [];
    } else {
      if(!ytQuery){ box.innerHTML = empty('⌕','Search YouTube','Enter a topic or keyword above.'); return; }
      var s = await api('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15&q='+encodeURIComponent(ytQuery));
      videos = (s.items || []).map(function(x){ return { id: x.id && x.id.videoId, snippet: x.snippet || {}, statistics: null }; });
    }
    if(!videos.length){ box.innerHTML = empty('▶','No videos available','Try another tab or search term.'); return; }
    box.innerHTML = '<div class="list" style="padding:12px">'+videos.map(function(v){
      var s = v.snippet || {}, id = v.id && typeof v.id === 'object' ? v.id.videoId : v.id;
      var th = s.thumbnails && (s.thumbnails.medium || s.thumbnails.default);
      return '<div class="item"><img class="video-thumb" src="'+esc((th && th.url) || '')+'" alt=""><div class="item-main"><div class="item-title">'+esc(s.title || 'Untitled')+'</div><div class="item-sub">'+esc(s.channelTitle || '')+' · '+esc(relTime(s.publishedAt))+(v.statistics ? ' · '+Number(v.statistics.viewCount || 0).toLocaleString()+' views' : '')+'</div></div>'+(id ? '<a class="btn sm" href="https://www.youtube.com/watch?v='+encodeURIComponent(id)+'" target="_blank" rel="noopener">Watch ↗</a>' : '')+'</div>';
    }).join('') + '</div>';
  }catch(e){ box.innerHTML = empty('⚠','YouTube request failed', e.message); }
}
function openYouTubeUpload(){
  openModal('Upload YouTube video',
    '<div class="notice" style="margin-bottom:14px"><span>ℹ</span><div>Uploads use the YouTube Data API and your account\'s upload permission. May be subject to quota and processing time.</div></div>' +
    '<div class="field"><label>Video file *</label><input id="ytFile" type="file" accept="video/*"></div>' +
    '<div class="field"><label>Video title *</label><input id="ytTitle" maxlength="100" placeholder="My new video"></div>' +
    '<div class="field"><label>Description</label><textarea id="ytDescription" maxlength="5000" placeholder="Video description"></textarea></div>' +
    '<div class="field"><label>Visibility</label><select id="ytPrivacy"><option value="private">Private</option><option value="unlisted">Unlisted</option><option value="public">Public</option></select><small>Private is default.</small></div>' +
    '<div id="ytUploadProgress" hidden><div class="progress-large"><i id="ytUploadBar"></i></div><p class="help" id="ytUploadLabel">Preparing upload…</p></div>',
    '<button class="btn ghost" id="ytUploadCancel">Cancel</button><button class="btn primary" id="ytUploadStart">Start upload</button>');
  $('#ytUploadCancel').addEventListener('click', closeModal);
  $('#ytUploadStart').addEventListener('click', async function(){
    var file = $('#ytFile').files[0], title = $('#ytTitle').value.trim();
    if(!file || !title){ toast('Choose a video file and enter a title', 'error'); return; }
    if(file.size === 0){ toast('The selected file is empty', 'error'); return; }
    var b = this; b.disabled = true; b.textContent = 'Uploading…';
    $('#ytUploadCancel').disabled = true;
    $('#ytUploadProgress').hidden = false;
    try{
      await ensureToken();
      var metadata = {
        snippet: { title: title, description: $('#ytDescription').value, categoryId: '22' },
        status: { privacyStatus: $('#ytPrivacy').value }
      };
      var start = await fetch('https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status', {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + accessToken,
          'Content-Type': 'application/json; charset=UTF-8',
          'X-Upload-Content-Type': file.type || 'application/octet-stream',
          'X-Upload-Content-Length': String(file.size)
        },
        body: JSON.stringify(metadata)
      });
      if(!start.ok) throw new Error('Could not start video upload: ' + start.status + ' ' + (await start.text()).slice(0,350));
      var loc = start.headers.get('Location');
      if(!loc) throw new Error('Google did not provide an upload URL.');
      await new Promise(function(resolve, reject){
        var xhr = new XMLHttpRequest();
        xhr.open('PUT', loc);
        xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
        xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
        xhr.upload.onprogress = function(e){
          if(e.lengthComputable){
            var pct = Math.round(e.loaded/e.total*100);
            $('#ytUploadBar').style.width = pct + '%';
            $('#ytUploadLabel').textContent = 'Sending video: ' + pct + '%';
          }
        };
        xhr.onload = function(){
          if(xhr.status >= 200 && xhr.status < 300){
            $('#ytUploadLabel').textContent = 'Upload received. YouTube is processing it…';
            resolve();
          } else reject(new Error('Upload failed: ' + xhr.status + ' ' + String(xhr.responseText || '').slice(0,300)));
        };
        xhr.onerror = function(){ reject(new Error('Network error during video upload')); };
        xhr.onabort = function(){ reject(new Error('Upload was cancelled')); };
        xhr.send(file);
      });
      closeModal();
      toast('Video uploaded to YouTube; processing may continue in Studio.', 'success');
      ytTab = 'uploads';
      go('youtube');
    }catch(e){
      toast(e.message, 'error');
      b.disabled = false; b.textContent = 'Retry upload';
      $('#ytUploadCancel').disabled = false;
    }
  });
}

async function runDiagnostics(){

    ['Profile', 'https://www.googleapis.com/oauth2/v3/userinfo'],

    ['Blogger', 'https://www.googleapis.com/blogger/v3/users/self'],

<script>
(function(){
'use strict';
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function clickNav(view){
  var b = document.querySelector('.nav-item[data-view="'+view+'"]');
  if(b) b.click();
}
function toastLight(msg, type){
  var toasts = $('#toasts'); if(!toasts) return;
  var el = document.createElement('div');
  el.className = 'toast ' + (type||'success');
  el.innerHTML = '<span>'+(type==='error'?'⚠':'✓')+'</span><span>'+escHtml(msg)+'</span>';
  toasts.appendChild(el);
  setTimeout(function(){
    el.style.opacity = '0'; el.style.transform = 'translateY(5px)';
    setTimeout(function(){ el.remove(); }, 220);
  }, 2800);
}
function dispatchQuick(action){
  var map = {
    event: function(){ clickNav('calendar'); setTimeout(function(){ var x = $('#newEvent'); if(x) x.click(); }, 420); },
    compose: function(){ clickNav('gmail'); setTimeout(function(){ var x = $('#gmailCompose'); if(x) x.click(); }, 520); },

/* -------- COMMAND PALETTE -------- */
var cmdk = $('#cmdk'), cmdkInput = $('#cmdkInput'), cmdkList = $('#cmdkList');
var cmdkItems = [], cmdkActive = 0;

var commands = [
  { group:'Navigate', ico:'⌂', label:'Overview', hint:'G D', run:function(){ clickNav('dashboard'); } },
  { group:'Navigate', ico:'▦', label:'Calendar', hint:'G C', run:function(){ clickNav('calendar'); } },
  { group:'Navigate', ico:'✉', label:'Gmail', hint:'G M', run:function(){ clickNav('gmail'); } },
  { group:'Navigate', ico:'▱', label:'Drive', hint:'G R', run:function(){ clickNav('drive'); } },
  { group:'Navigate', ico:'▤', label:'Sheets', hint:'G S', run:function(){ clickNav('sheets'); } },
  { group:'Navigate', ico:'✎', label:'Blogger', hint:'G B', run:function(){ clickNav('blogger'); } },
