function fuzzy(q, text){
  q = q.toLowerCase(); text = text.toLowerCase();
  if(!q) return 1;
  var idx = text.indexOf(q);
  if(idx !== -1) return 100 - idx;
  var qi = 0;
  for(var i = 0; i < text.length && qi < q.length; i++) if(text[i] === q[qi]) qi++;
  return qi === q.length ? qi : 0;
}
function renderCmdk(query){
  var q = (query||'').trim();
  var scored = commands.map(function(c){
    var s = fuzzy(q, c.label); if(!q) s = 1;
    return { cmd:c, score:s };
  }).filter(function(x){ return x.score > 0; });
  cmdkItems = scored.map(function(x){ return x.cmd; });
  if(!cmdkItems.length){
    cmdkList.innerHTML = '<div class="cmdk-empty">No commands match "'+escHtml(q)+'"</div>';
    return;
  }
  var lastGroup = '', html = '';
  cmdkItems.forEach(function(c, i){
    if(c.group !== lastGroup){ html += '<div class="cmdk-group">'+escHtml(c.group)+'</div>'; lastGroup = c.group; }
    html += '<div class="cmdk-item'+(i === cmdkActive ? ' active' : '')+'" data-cmdk-i="'+i+'">' +
      '<span class="ico">'+c.ico+'</span><span>'+escHtml(c.label)+'</span>' +
      (c.hint ? '<span class="cmdk-meta">'+escHtml(c.hint)+'</span>' : '') +
    '</div>';
  });
  cmdkList.innerHTML = html;
  $$('[data-cmdk-i]', cmdkList).forEach(function(el){
    el.addEventListener('click', function(){ runCmd(+el.dataset.cmdkI); });
    el.addEventListener('mouseenter', function(){ cmdkActive = +el.dataset.cmdkI; updateActive(); });
  });
}
function updateActive(){
  $$('.cmdk-item', cmdkList).forEach(function(el){ el.classList.toggle('active', +el.dataset.cmdkI === cmdkActive); });
  var a = $('.cmdk-item.active', cmdkList);
  if(a && a.scrollIntoView) a.scrollIntoView({ block: 'nearest' });
}
function openCmdk(){ cmdk.hidden = false; cmdkInput.value = ''; cmdkActive = 0; renderCmdk(''); setTimeout(function(){ cmdkInput.focus(); }, 40); }
function closeCmdk(){ cmdk.hidden = true; }
function runCmd(i){ var c = cmdkItems[i]; if(!c) return; closeCmdk(); setTimeout(function(){ try{ c.run(); }catch(e){ toastLight(e.message, 'error'); } }, 60); }
cmdkInput.addEventListener('input', function(){ cmdkActive = 0; renderCmdk(this.value); });
cmdkInput.addEventListener('keydown', function(e){
  if(e.key === 'ArrowDown'){ e.preventDefault(); cmdkActive = Math.min(cmdkItems.length-1, cmdkActive+1); updateActive(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); cmdkActive = Math.max(0, cmdkActive-1); updateActive(); }
  else if(e.key === 'Enter'){ e.preventDefault(); runCmd(cmdkActive); }
  else if(e.key === 'Escape'){ e.preventDefault(); closeCmdk(); }
});
cmdk.addEventListener('click', function(e){ if(e.target === cmdk) closeCmdk(); });

document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    if(cmdk.hidden) openCmdk(); else closeCmdk();
  }
}, true);

/* -------- TOOLBOX -------- */
var fab = $('#trkFab'), panel = $('#trkPanel');
function openPanel(tab){ panel.hidden = false; switchTab(tab || currentPanelTab()); }
function closePanel(){ panel.hidden = true; }
function currentPanelTab(){ var a = $('.trk-tab.active'); return a ? a.dataset.trkTab : 'notes'; }
fab.addEventListener('click', function(){ panel.hidden ? openPanel() : closePanel(); });
$$('.trk-tab').forEach(function(t){ t.addEventListener('click', function(){ switchTab(t.dataset.trkTab); }); });
function switchTab(name){
  $$('.trk-tab').forEach(function(t){ t.classList.toggle('active', t.dataset.trkTab === name); });
  $$('.trk-pane').forEach(function(p){ p.hidden = p.dataset.trkPane !== name; });
  if(name === 'activity') renderActivity();
  if(name === 'notes') renderNotes();
}
document.addEventListener('click', function(e){
  if(panel.hidden) return;
  if(panel.contains(e.target) || fab.contains(e.target)) return;
  closePanel();
});

/* -------- NOTES -------- */
var NOTES_KEY = 'trikku-notes-v1';
var notes = [];
try{ notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]') || []; }catch(e){ notes = []; }
function saveNotes(){ try{ localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }catch(e){} }
function renderNotes(){
  var list = $('#trkNotesList');
  if(!notes.length){ list.innerHTML = '<div class="trk-act-empty">No notes yet. Write one above.</div>'; return; }
  list.innerHTML = notes.map(function(n, i){
    return '<div class="trk-note"><div class="trk-note-text">'+escHtml(n.text)+'</div><button class="del" data-note-del="'+i+'" title="Delete" aria-label="Delete note">×</button></div>';
  }).join('');
  $$('[data-note-del]', list).forEach(function(b){
    b.addEventListener('click', function(){
      notes.splice(+b.dataset.noteDel, 1);
      saveNotes(); renderNotes(); logActivity('Deleted a note');
    });
  });
}
function saveNote(){
  var inp = $('#trkNoteInput'), v = inp.value.trim();
  if(!v){ toastLight('Write something first', 'info'); return; }
  notes.unshift({ text: v, at: Date.now() });
  if(notes.length > 60) notes.length = 60;
  saveNotes(); renderNotes(); inp.value = '';
  logActivity('Saved a note'); toastLight('Note saved');
}
$('#trkNoteSave').addEventListener('click', saveNote);
$('#trkNoteInput').addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); saveNote(); }
});
$('#trkNoteClear').addEventListener('click', function(){ $('#trkNoteInput').value = ''; });

/* -------- TIMER -------- */
var timer = { total: 25*60, left: 25*60, running: false, id: 0 };
var timerDisplay = $('#trkTimerDisplay'), timerLabel = $('#trkTimerLabel');
function fmtTimer(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function renderTimer(){
  timerDisplay.textContent = fmtTimer(timer.left);
  timerLabel.textContent = timer.running ? 'Running…' : (timer.left === timer.total ? 'Ready' : (timer.left === 0 ? 'Complete' : 'Paused'));
}
function beep(){
  try{
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.65);
    o.start(); o.stop(ctx.currentTime + 0.7);
    setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 900);
  }catch(e){}
}
function startTimer(){
  if(timer.running) return;
  if(timer.left <= 0) timer.left = timer.total;
  timer.running = true;
  var endAt = Date.now() + timer.left * 1000;
  timer.id = setInterval(function(){
    timer.left = Math.max(0, Math.round((endAt - Date.now())/1000));
    renderTimer();
    if(timer.left <= 0){
      clearInterval(timer.id); timer.running = false;
      beep(); toastLight('Focus session complete!');
      logActivity('Completed a focus session');
    }
  }, 250);
  renderTimer(); logActivity('Started a ' + (timer.total/60) + ' min focus session');
}
function pauseTimer(){ if(!timer.running) return; clearInterval(timer.id); timer.running = false; renderTimer(); }
function resetTimer(){ clearInterval(timer.id); timer.running = false; timer.left = timer.total; renderTimer(); }
function setPreset(min){ timer.total = min * 60; resetTimer(); }
$('#trkTimerStart').addEventListener('click', startTimer);
$('#trkTimerPause').addEventListener('click', pauseTimer);
$('#trkTimerReset').addEventListener('click', resetTimer);
$$('[data-trk-preset]').forEach(function(b){ b.addEventListener('click', function(){ setPreset(+b.dataset.trkPreset); }); });
renderTimer();

/* -------- ACTIVITY -------- */
var ACT_KEY = 'trikku-activity-v1';
var activities = [];
try{ activities = JSON.parse(localStorage.getItem(ACT_KEY) || '[]') || []; }catch(e){ activities = []; }
function saveActivities(){ try{ localStorage.setItem(ACT_KEY, JSON.stringify(activities.slice(0, 60))); }catch(e){} }
function logActivity(text){
  activities.unshift({ text: text, at: Date.now() });
  if(activities.length > 60) activities.length = 60;
  saveActivities();
  var pane = $('[data-trk-pane="activity"]');
  if(!panel.hidden && pane && !pane.hidden) renderActivity();
}
function relAgo(t){
  var s = Math.round((Date.now() - t)/1000);
  if(s < 60) return s + 's ago';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function renderActivity(){
  var list = $('#trkActList');
  if(!activities.length){ list.innerHTML = '<div class="trk-act-empty">No activity yet. Actions you take will appear here.</div>'; return; }
  list.innerHTML = activities.map(function(a){
    return '<div class="trk-act-item"><span class="ico">•</span><span>'+escHtml(a.text)+'</span><span class="time">'+relAgo(a.at)+'</span></div>';
  }).join('');
}
$('#trkActClear').addEventListener('click', function(){
  if(!confirm('Clear all activity history?')) return;
  activities = []; saveActivities(); renderActivity();
});
var navEl = document.getElementById('nav');
if(navEl) navEl.addEventListener('click', function(e){
  var b = e.target.closest('.nav-item');
  if(b) logActivity('Opened ' + b.textContent.replace(/\s+/g, ' ').trim());
}, true);

/* -------- FOCUS + DENSITY hooks (delegate to core) -------- */
function toggleFocus(){
  if(window.__trk && window.__trk.toggleFocus) return window.__trk.toggleFocus();
  document.body.classList.toggle('trk-focus');
}
function toggleDensity(){
  if(window.__trk && window.__trk.toggleDensity) return window.__trk.toggleDensity();
  document.body.classList.toggle('trk-compact');
}

/* -------- KEYBOARD SHORTCUTS -------- */
var gPressed = false, gTimer = 0, nPressed = false, nTimer = 0;
document.addEventListener('keydown', function(e){
  if(!cmdk.hidden) return;
  if(e.target.matches('input, textarea, select, [contenteditable=true]')) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if(gPressed){
    gPressed = false; clearTimeout(gTimer);
    var map = { d:'dashboard', c:'calendar', m:'gmail', r:'drive', s:'sheets', b:'blogger', y:'youtube', ',':'settings' };
    if(map[k]){ e.preventDefault(); clickNav(map[k]); return; }
  }
  if(nPressed){
    nPressed = false; clearTimeout(nTimer);
    var nmap = { e:'event', m:'compose', f:'folder', v:'upload', n:'notes', t:'timer' };
    if(nmap[k]){
      e.preventDefault();
      if(nmap[k] === 'notes') openPanel('notes');
      else if(nmap[k] === 'timer') openPanel('timer');
      else dispatchQuick(nmap[k]);
      return;
    }
  }
  if(e.shiftKey && k === 'f'){ e.preventDefault(); toggleFocus(); return; }
  if(k === 'g'){ gPressed = true; gTimer = setTimeout(function(){ gPressed = false; }, 900); return; }
  if(k === 'n'){ nPressed = true; nTimer = setTimeout(function(){ nPressed = false; }, 900); return; }
  if(e.shiftKey && (k === '/' || k === '?')){ e.preventDefault(); showHelp(); return; }
  if(k === 'escape' && !panel.hidden){ closePanel(); return; }
});

function showHelp(){
  var html = '<div style="display:grid;gap:10px;font-size:12px">' +
    row('Ctrl / ⌘ + K', 'Open command palette') +
    row('/', 'Focus Drive search') +
    row('G then D / C / M / R / S / B / Y / ,', 'Jump to views') +
    row('N then E / M / F / V', 'Create event, mail, folder, video') +
    row('N then N / T', 'Open Notes / Focus Timer') +
    row('Shift + F', 'Toggle focus mode') +
    row('? or Shift + /', 'Show this help') +
    row('Esc', 'Close dialogs and panels') +
  '</div>';
  var modal = document.getElementById('modal');
  var t = document.getElementById('modalTitle');
  var b = document.getElementById('modalBody');
  var f = document.getElementById('modalFoot');
  if(modal && t && b && f){
    t.textContent = 'Keyboard shortcuts';
    b.innerHTML = html;
    f.innerHTML = '<button class="btn primary" id="trkHelpClose">Got it</button>';
    modal.hidden = false;
    var closeBtn = document.getElementById('trkHelpClose');
    if(closeBtn) closeBtn.addEventListener('click', function(){ modal.hidden = true; });
  }
}
function row(k, v){
  return '<div style="display:flex;gap:12px;align-items:center">' +
    '<span class="kbd" style="position:static;transform:none;font-size:10px;padding:3px 8px;min-width:0">'+escHtml(k)+'</span>' +
    '<span style="color:var(--muted)">'+escHtml(v)+'</span>' +
  '</div>';
}

renderNotes();
renderActivity();
try{
  if(!sessionStorage.getItem('trikku-session')){
    sessionStorage.setItem('trikku-session', '1');
    logActivity('Welcome to TRIKKU Pro 2.2');
  }
}catch(e){}
})();
</script>

<!-- ============================================================
     TRIKKU LIQUID GLASS RUNTIME (single tilt impl, mobile safe)
     ============================================================ -->
<script>
(function(){
'use strict';
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- Scroll progress + back-to-top ---- */
var prog = document.createElement('div');
prog.className = 'trk-progress';
prog.innerHTML = '<i></i>';
document.body.appendChild(prog);
var progBar = prog.firstChild;

var topBtn = document.createElement('button');
topBtn.className = 'trk-top';
topBtn.setAttribute('aria-label', 'Back to top');
topBtn.title = 'Back to top';
topBtn.textContent = '↑';
topBtn.addEventListener('click', function(){
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
});
document.body.appendChild(topBtn);

var ticking = false;
function onScroll(){
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(function(){
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    var pct = max > 0 ? (h.scrollTop / max) * 100 : 0;
    progBar.style.width = pct.toFixed(2) + '%';
    topBtn.classList.toggle('show', h.scrollTop > 420);
    ticking = false;
  });
}
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();

/* ---- Scroll reveal ---- */
function markReveal(root){
  if(reduce) return;
  var scope = root || document;
  $$('.card, .hero, .section-title', scope).forEach(function(el){
    if(el.classList.contains('trk-reveal')) return;
    if(el.closest('.modal, .trk-panel, .cmdk-box, .sidebar, .topbar')) return;
    el.classList.add('trk-reveal');
  });
}
var io = ('IntersectionObserver' in window)
  ? new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 })
  : null;
function observeReveal(){
  if(!io) return;
  $$('.trk-reveal:not(.in)').forEach(function(el){
    var idx = Array.prototype.indexOf.call(el.parentNode.children, el);
    el.style.transitionDelay = Math.min(idx, 6) * 35 + 'ms';
    io.observe(el);
  });
}
markReveal();
observeReveal();

var viewsRoot = document.querySelector('.views');
if(viewsRoot && window.MutationObserver){
  var mo = new MutationObserver(function(){
    clearTimeout(mo._t);
    mo._t = setTimeout(function(){ markReveal(viewsRoot); observeReveal(); }, 100);
  });
  mo.observe(viewsRoot, { childList: true, subtree: true });
}

/* ---- 3D tilt (single implementation) ---- */
if(window.matchMedia('(hover:hover) and (pointer:fine)').matches && !reduce){
  var tiltSeen = new WeakSet();
  function enhanceTilt(el){
    if(tiltSeen.has(el)) return;
    tiltSeen.add(el);
    if(getComputedStyle(el).position === 'static') el.style.position = 'relative';
    if(!el.querySelector(':scope > .trk-glow-layer')){
      var glow = document.createElement('div');
      glow.className = 'trk-glow-layer';
      glow.style.cssText = 'position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(480px circle at var(--trk-gx,50%) var(--trk-gy,50%),color-mix(in srgb,var(--accent) 26%,transparent),transparent 58%);opacity:0;transition:opacity .32s ease;z-index:2';
      el.appendChild(glow);
    }
    var raf = 0, mx = 0, my = 0, rect = null;
    el.addEventListener('pointerenter', function(){ rect = el.getBoundingClientRect(); });
    el.addEventListener('pointermove', function(e){
      if(e.pointerType && e.pointerType !== 'mouse') return;
      if(!rect) rect = el.getBoundingClientRect();
      mx = e.clientX; my = e.clientY;
      if(raf) return;
      raf = requestAnimationFrame(function(){
        raf = 0;
        if(!rect || !rect.width || !rect.height) return;
        var x = Math.max(0, Math.min(1, (mx - rect.left)/rect.width));
        var y = Math.max(0, Math.min(1, (my - rect.top)/rect.height));
        el.style.setProperty('--trk-rx', ((0.5 - y) * 3.0).toFixed(2) + 'deg');
        el.style.setProperty('--trk-ry', ((x - 0.5) * 3.0).toFixed(2) + 'deg');
        el.style.setProperty('--trk-gx', (x*100).toFixed(1) + '%');
        el.style.setProperty('--trk-gy', (y*100).toFixed(1) + '%');
        el.style.transform = 'perspective(1000px) rotateX(var(--trk-rx)) rotateY(var(--trk-ry)) translateZ(0)';
        el.style.transition = 'transform .12s cubic-bezier(.22,1,.36,1), box-shadow .3s';
        var glow = el.querySelector(':scope > .trk-glow-layer');
        if(glow) glow.style.opacity = '.5';
      });
    }, { passive: true });
    el.addEventListener('pointerleave', function(){
      rect = null;
      el.style.transform = '';
      el.style.transition = '';
      var glow = el.querySelector(':scope > .trk-glow-layer');
      if(glow) glow.style.opacity = '0';
    });
  }
  function scanTilt(){
    $$('.hero, .card').forEach(function(el){
      if(el.classList.contains('pad0')) return;
      enhanceTilt(el);
    });
  }
  scanTilt();
  if(viewsRoot && window.MutationObserver){
    var mo2 = new MutationObserver(function(){
      clearTimeout(mo2._t);
      mo2._t = setTimeout(scanTilt, 80);
    });
    mo2.observe(viewsRoot, { childList: true, subtree: true });
  }
}
})();
</script>
</body>
</html>
